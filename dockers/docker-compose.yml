services:
  pgsql:
    image: pgvector/pgvector:pg17
    container_name: govdoc-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: document_scanner
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d document_scanner"]
      interval: 5s
      retries: 5
  # HTTP API — kept for direct testing (curl -F file=@x.pdf :8080/extract)
  ocr-api:
    build: ./ocr-service
    container_name: document-scanner-ocr-api
    restart: unless-stopped
    ports:
      - "8080:8080"

  # SQS consumer — the production path.
  # Scale with: docker compose up -d --scale ocr-worker=3
  ocr-worker:
    build: ./ocr-service
    command: python worker.py
    restart: unless-stopped
    environment:
      SQS_ENDPOINT_URL: http://floci:4566
      OCR_JOBS_QUEUE_URL: http://floci:4566/000000000000/ocr-jobs
      AWS_DEFAULT_REGION: us-east-1
      OCR_CALLBACK_SECRET: dev-callback-secret-change-me
      S3_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the worker reach Laravel on your host
    depends_on:
      floci:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: govdoc-search
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 10

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    container_name: document-scanner-search-ui
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch

  floci:
    image: floci/floci:latest
    container_name: govdoc-floci
    restart: unless-stopped
    ports:
      - "4566:4566"    # AWS-compatible API (SQS etc.) — apps connect here
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      retries: 10

  # One-shot: creates the SQS queues and S3 bucket the app depends on, then exits.
  # ocr-jobs gets a redrive policy so worker.py can rely on SQS's own retry
  # counting instead of hand-rolling a retry queue (see worker.py's docstring).
  floci-init:
    image: floci/floci:latest-compat
    depends_on:
      floci:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # VisibilityTimeout must outlast the slowest job (Ollama chat/embed calls can
        # take minutes, especially cold-start) — default 30s causes duplicate delivery
        # mid-processing and DeleteMessage failures on stale receipt handles.
        #
        # Each main queue gets its own DLQ. Note: AnswerAssistantQuestion/EmbedDocument
        # catch every exception internally and never let a failure reach SQS, so this
        # DLQ only catches messages from a worker that crashed outright (OOM, killed
        # process) mid-job — not ordinary job-level failures, which show up in
        # Laravel's own failed_jobs table instead.
        create_queue_with_dlq() {
          name="$$1"
          visibility="$$2"
          dlq_name="$${name}-dlq"

          dlq_url=$$(aws --endpoint-url http://floci:4566 sqs create-queue --queue-name "$$dlq_name" --query QueueUrl --output text)
          dlq_arn=$$(aws --endpoint-url http://floci:4566 sqs get-queue-attributes --queue-url "$$dlq_url" --attribute-names QueueArn --query Attributes.QueueArn --output text)

          cat > "/tmp/$${name}-attrs.json" <<EOF
        {"RedrivePolicy": "{\"deadLetterTargetArn\":\"$$dlq_arn\",\"maxReceiveCount\":\"3\"}", "VisibilityTimeout": "$$visibility"}
        EOF

          aws --endpoint-url http://floci:4566 sqs create-queue --queue-name "$$name" --attributes "file:///tmp/$${name}-attrs.json"
        }

        create_queue_with_dlq govdoc-jobs 1800
        create_queue_with_dlq assistant-questions 1800
        create_queue_with_dlq ocr-jobs 300

        aws --endpoint-url http://floci:4566 s3 mb s3://documents || true
        echo "Floci ready: govdoc-jobs, assistant-questions, ocr-jobs queues (each with a DLQ), and documents bucket created"

  # Ollama intentionally runs natively on the host (`brew services start ollama`),
  # not here. Docker Desktop's Linux VM has no Metal/GPU passthrough on macOS, so
  # a containerized Ollama is CPU-only — measured 8.7 tok/s in Docker vs. 20.1
  # tok/s native on Apple Silicon (same qwen2.5:7b model, same prompt). Laravel
  # still just talks to OLLAMA_HOST=http://localhost:11434, so nothing else changes.

volumes:
  pgsql-data:
  opensearch-data:
